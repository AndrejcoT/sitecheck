[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitecheck"
version = "0.1.0"
description = "A pre-deployment checklist CLI for websites and WordPress projects."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Andrej" }
]
license = { text = "MIT" }
dependencies = []

[project.scripts]
sitecheck = "sitecheck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]